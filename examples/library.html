<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TISU · 图书馆组件嵌入示例</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf0e8;color:#233c42;font:15px/1.7 system-ui,"Noto Sans SC",sans-serif}header{max-width:1440px;margin:auto;padding:27px 36px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4dccf}.brand{font-size:23px;font-weight:700;letter-spacing:.16em}.brand small{display:block;font-size:10px;letter-spacing:.2em;color:#778d79}a{color:#446955;text-underline-offset:4px}header a{font-size:12px}main{max-width:1440px;margin:auto;padding:30px 36px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#829379}h1{font:36px/1.3 Georgia,"Noto Serif SC",serif;margin:12px 0 18px}h2{font-size:17px;margin:0}.intro{color:#718075;font-size:13px}.word{background:#fafbf6;border:1px solid #d9e1d3;border-radius:12px;padding:17px;margin-top:14px}.word b{font-size:21px;font-weight:500}.word small{display:block;color:#8b9989;font-size:11px}.word p{margin:10px 0 0;font-size:12px;color:#748371}.panel{min-width:0;background:#fffdf5;border:1px solid #d4dece;border-radius:19px;overflow:hidden;box-shadow:0 20px 55px #3d5e3912}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 21px}.panel-head span{font-size:11px;color:#7b8d78}.viewer{--tisu-library-height:590px;--tisu-library-radius:0px}.actions{padding:17px 21px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions button{border:1px solid #bdcbb6;border-radius:8px;padding:9px 15px;background:#eef2e5;color:#3b583f;font:inherit;font-size:12px;cursor:pointer}.actions button:hover{background:#e1e9d6}.status{margin-left:auto;font-size:11px;color:#84947f}.error{padding:14px;background:#fff4e8;color:#8a542d}[hidden]{display:none}footer{max-width:1440px;margin:auto;padding:0 36px 28px;font-size:11px;color:#82917e}@media(max-width:850px){header{padding:20px}main{padding:20px;grid-template-columns:1fr}.words{display:none}h1{font-size:28px}.intro{max-width:540px}.viewer{--tisu-library-height:540px}footer{padding:0 20px 24px}.status{width:100%;margin-left:0}}@media(max-width:480px){.viewer{--tisu-library-height:480px}.panel-head{padding:12px 15px}.actions{padding:13px}.actions button{padding:8px 11px}}
  </style>
</head>
<body>
  <header><div class="brand">TISU<small>A PLACE FOR STORIES</small></div><a href="./full-page/index.html">打开原版全屏示例 ↗</a></header>
  <main>
    <aside><span class="eyebrow">WORKBENCH / LIBRARY</span><h1>在书页之间，<br>留一处风景。</h1><p class="intro">这是图书馆嵌入工作台面板的示例。点击进入，沿书架与回廊漫步；右侧楼梯连接三层书厅。</p><div class="words"><div class="word"><b>清雅</b><small>qīng yǎ</small><p>清新雅致。像窗边的一束光，落在未合上的书页。</p></div><div class="word"><b>静谧</b><small>jìng mì</small><p>安静。在群星之下，给阅读留一点时间。</p></div></div></aside>
    <section class="panel" aria-label="体素图书馆嵌入面板">
      <div class="panel-head"><h2>星穹图书馆</h2><span>群星之下 · 万卷之中</span></div>
      <tisu-library class="viewer" id="library" view="outside" max-pixel-ratio="1.5"></tisu-library>
      <div class="actions"><button id="enter">进入书厅</button><button id="upper">登上三层</button><button id="night">切换昼夜</button><span class="status" id="status">建筑全景</span></div>
      <p class="error" id="error" hidden></p>
    </section>
  </main>
  <footer>组件使用自己的控件与样式，可以放入现有页面的卡片、侧栏或独立面板。词语卡片仅为布局示例。</footer>
  <script type="module">
    import { defineLibraryElement } from '../components/astral-library/index.js';
    const library = document.querySelector('#library');
    library.addEventListener('library-state-change', event => {
      const state = event.detail;
      document.querySelector('#status').textContent = `${state.mode === 'outside' ? '建筑全景' : `第 ${state.floor + 1} 层 · 自由漫步`}${state.night ? ' · 月夜' : ''}`;
    });
    library.addEventListener('library-error', () => {
      const error = document.querySelector('#error');
      error.hidden = false; error.textContent = '当前浏览器未能启动 3D 场景，请检查 WebGL 与硬件加速。';
    });
    defineLibraryElement();
    document.querySelector('#enter').addEventListener('click', () => library.enter());
    document.querySelector('#upper').addEventListener('click', () => library.setView('upper'));
    document.querySelector('#night').addEventListener('click', () => library.setNight(!library.getState()?.night));
  </script>
</body>
</html>
